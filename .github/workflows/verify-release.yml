name: Verify release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to validate
        required: true
        default: v0.1.0
      linux_only:
        description: Recheck Linux without repeating a successful Windows job
        type: boolean
        default: false
permissions:
  # Draft releases are visible only to credentials with repository write access.
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and verify artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir artifacts
          cd artifacts
          sha256sum -c SHA256SUMS.txt
          tar -xzf MEDIANOCHE-*-SteamOS-x64.tar.gz
      - name: Test installer in isolated homes
        run: python3 -m unittest discover -s tests -p test_steam_installer.py -v
      - name: Check runtime and bytecode on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libopengl0
          cd artifacts/MEDIANOCHE-SteamOS-x64
          ./runtime/love.AppImage --appimage-extract >/dev/null
          find squashfs-root -name '*.so*' -type f -print
          export SDL_AUDIODRIVER=dummy
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a ./launch.sh smoke
          xvfb-run -a ./launch.sh test
          xvfb-run -a ./launch.sh render
  windows:
    if: ${{ !inputs.linux_only }}
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --pattern '*Windows-x64.zip' --dir artifacts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check Windows package and installer
        shell: pwsh
        run: |
          $package = (Get-ChildItem artifacts/*Windows-x64.zip).FullName
          python tests/verify_windows_package.py $package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_steam_installer.py -v
          exit $LASTEXITCODE
